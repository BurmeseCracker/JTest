<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Card Quiz App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 📱 Header with Left-side Menu Icon -->
    <header class="app-header-container">
        <!-- ဘယ်ဘက်ထောင့်တွင် ရှိသော Menu Icon ခလုတ် (နှိပ်လျှင် Page ပြောင်းမည်) -->
        <button id="menuToggleBtn" class="menu-toggle-btn" onclick="togglePage()" title="Menu ပြောင်းရန်">
            ⚙️
        </button>

        <div class="brand-area">
            <h1 id="appHeaderTitle">🎮 Quiz Mode</h1>
        </div>
    </header>

    <!-- 🎮 PAGE 1: Quiz Mode View -->
    <main id="quizPage" class="page-view active">
        <div class="quiz-card-wrapper">
            <div id="timer">အချိန်: 5 စက္ကန့်</div>
            
            <div class="cards-container" id="cardsContainer"></div>

            <div class="question-wrapper">
                <div id="questionBox">မေးခွန်းပေါ်မည်</div>
            </div>

            <div id="result"></div>
            <button id="nextBtn" onclick="nextQuiz()">နောက်တစ်ပုဒ်သို့ (Next)</button>
        </div>
    </main>

    <!-- ⚙️ PAGE 2: Admin Dashboard View -->
    <main id="dashboardPage" class="page-view">
        <div class="admin-card">
            <h3>+ မေးခွန်း / Kanji အချက်အလက်သစ် ထည့်သွင်းရန်</h3>
            
            <div class="form-group">
                <label>Kanji စာလုံးများ (တစ်ကွက်လျှင် တစ်လုံး သို့မဟုတ် တွဲလုံး ၂ လုံးထည့်ပါ):</label>
                <div id="kanjiInputsContainer">
                    <div class="kanji-input-row">
                        <input type="text" class="kanji-box" placeholder="ဥပမာ: 日" maxlength="3" required>
                    </div>
                    <div class="kanji-input-row">
                        <input type="text" class="kanji-box" placeholder="ဥပမာ: 月" maxlength="3" required>
                    </div>
                    <div class="kanji-input-row">
                        <input type="text" class="kanji-box" placeholder="ဥပမာ: 電車" maxlength="3" required>
                    </div>
                </div>
                <button type="button" class="add-kanji-field-btn" onclick="addKanjiInputBox()">+ Add Kanji (ကွက်လပ်ထပ်ထည့်ရန်)</button>
            </div>

            <div class="form-group">
                <label>Hiragana မေးခွန်း / အဓိပ္ပာယ်:</label>
                <input type="text" id="questionInput" placeholder="ဥပမာ: でんしゃ (densha) - လျှပ်စစ်ရထား">
            </div>

            <div class="form-group">
                <label>အဖြေမှန် Kanji (အပေါ်က Box ထဲမှ တစ်ခုကို ရွေးရေးပါ):</label>
                <input type="text" id="answerInput" placeholder="ဥပမာ: 電車">
            </div>

            <div class="btn-group">
                <button class="btn-primary" onclick="addQuizSet()">+ သိမ်းဆည်းမည်</button>
                <button class="btn-danger" onclick="clearAllData()">အချက်အလက်အားလုံး ဖျက်မည်</button>
            </div>
        </div>

        <h3 style="margin-bottom: 15px; text-align: left; color: #1e293b;">📋 လက်ရှိ မေးခွန်းစာရင်း</h3>
        <div class="item-list" id="dashboardList"></div>
    </main>

    <!-- Scripts (ကျန်တဲ့ kanji.js, quiz.js, ans.js, dashboard.js တို့က အရင်အတိုင်း ဆက်သုံးပါ) -->
    <script src="kanji.js"></script>
    <script src="quiz.js"></script>
    <script src="ans.js"></script>
    <script src="dashboard.js"></script>
    <script src="app.js"></script>
</body>
</html>
