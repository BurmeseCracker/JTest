<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Card Quiz</title>
    <!-- သီးသန့်ခွဲထုတ်ထားသော style.css ကို ချိတ်ဆက်ခြင်း -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Txt File Upload Section -->
    <div class="upload-box">
        <label for="txtFile">📁 Kanji .txt ဖိုင်တင်ရန်: </label>
        <input type="file" id="txtFile" accept=".txt" onchange="handleTxtUpload(event)">
    </div>

    <div id="timer">အချိန်: 5 စက္ကန့်</div>

    <div class="quiz-header">
        <h2>Kanji Card Quiz</h2>
    </div>
    
    <div class="cards-container" id="cardsContainer"></div>

    <div class="question-wrapper">
        <div id="questionBox">မေးခွန်းပေါ်မည်</div>
    </div>

    <div id="result"></div>
    <div>
        <button id="nextBtn" onclick="nextQuiz()">နောက်တစ်ပုဒ်သို့ (Next)</button>
    </div>

    <!-- JavaScript ဖိုင်များကို ချိတ်ဆက်ခြင်း -->
    <script src="kanji.js"></script>
    <script src="quiz.js"></script>
    <script src="ans.js"></script>
    
    <script>
        let quizDatabase = [];

        let activeKanjiLists = [];
        let savedKanjiData = localStorage.getItem("uploadedKanjiLists");

        if (savedKanjiData) {
            activeKanjiLists = JSON.parse(savedKanjiData);
        } else {
            if (typeof kanjiLists !== 'undefined') {
                activeKanjiLists = kanjiLists;
            }
        }

        if (activeKanjiLists.length > 0) {
            for (let i = 0; i < activeKanjiLists.length; i++) {
                let currentKanjiSet = activeKanjiLists[i];
                let qText = "အခန်း (" + (i + 1) + ") - ရှာပါ။";
                let correctK = currentKanjiSet[0]; 

                if (typeof questionLists !== 'undefined' && questionLists[i]) {
                    qText = questionLists[i];
                }
                if (typeof answerLists !== 'undefined' && answerLists[i]) {
                    correctK = answerLists[i];
                }

                quizDatabase.push({
                    kanjis: currentKanjiSet,
                    question: qText,
                    correctKanji: correctK
                });
            }
        }

        function handleTxtUpload(event) {
            let file = event.target.files[0];
            if (!file) return;

            let reader = new FileReader();
            reader.onload = function(e) {
                let text = e.target.result;
                let lines = text.split(/\r?\n/).map(line => line.trim()).filter(line => line.length > 0);
                
                let chunkedLists = [];
                for (let i = 0; i < lines.length; i += 3) {
                    let chunk = lines.slice(i, i + 3);
                    if (chunk.length > 0) {
                        chunkedLists.push(chunk);
                    }
                }

                localStorage.setItem("uploadedKanjiLists", JSON.stringify(chunkedLists));
                alert("Kanji စာရင်းများကို အောင်မြင်စွာ တင်ပြီး အခန်းများ ဖန်တီးပြီးပါပြီ! 🎉");
                location.reload();
            };
            reader.readAsText(file);
        }

        let currentIndex = 0;
        let timeLeft = 5;
        let timerInterval;
        let isAnswered = false;
        let currentCorrectOriginalKanji = "";

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function loadQuiz() {
            if (quizDatabase.length === 0) {
                document.getElementById("questionBox").innerText = "ကျေးဇူးပြု၍ Kanji .txt ဖိုင်တစ်ခုကို တင်ပေးပါ (သို့) kanji.js ထည့်ပါ။";
                return;
            }

            clearInterval(timerInterval);
            timeLeft = 5;
            isAnswered = false;
            document.getElementById("timer").innerText = "အချိန်: " + timeLeft + " စက္ကန့်";
            
            let current = quizDatabase[currentIndex];
            document.getElementById("questionBox").innerText = current.question;
            document.getElementById("result").innerText = "";
            document.getElementById("nextBtn").style.display = "none";

            currentCorrectOriginalKanji = current.correctKanji;
            let randomizedKanjis = shuffleArray(current.kanjis);

            let cardsContainer = document.getElementById("cardsContainer");
            cardsContainer.innerHTML = "";
            
            randomizedKanjis.forEach((kanjiChar, index) => {
                let cardDiv = document.createElement("div");
                cardDiv.className = "card";
                cardDiv.id = "card-" + index;
                cardDiv.innerText = kanjiChar;
                cardDiv.style.fontSize = "42px";

                cardDiv.onclick = () => selectCard(kanjiChar, currentCorrectOriginalKanji, index);
                cardsContainer.appendChild(cardDiv);
            });

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = "အချိန်: " + timeLeft + " စက္ကန့်";

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isAnswered) {
                        timeOutAction();
                    }
                }
            }, 1000);
        }

        function selectCard(selectedKanji, correctKanji, clickedIndex) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);

            let cards = document.getElementsByClassName("card");
            for (let i = 0; i < cards.length; i++) {
                if (cards[i].innerText === correctKanji) {
                    cards[i].classList.add("correct");
                }
            }

            if (selectedKanji === correctKanji) {
                document.getElementById("result").style.color = "#4CAF50";
                document.getElementById("result").innerText = "မှန်ကန်ပါတယ်! 🎉";
            } else {
                cards[clickedIndex].classList.add("wrong");
                document.getElementById("result").style.color = "#F44336";
                document.getElementById("result").innerText = "အဖြေမှားယွင်းနေပါတယ် ❌";
            }

            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function timeOutAction() {
            isAnswered = true;
            let cards = document.getElementsByClassName("card");

            for (let i = 0; i < cards.length; i++) {
                if (cards[i].innerText === currentCorrectOriginalKanji) {
                    cards[i].classList.add("correct");
                }
            }

            document.getElementById("timer").innerText = "အချိန်ကုန်သွားပါပြီ ⌛";
            document.getElementById("result").style.color = "#F44336";
            document.getElementById("result").innerText = "အချိန်ကုန်သွားပါပြီ ❌";
            
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function nextQuiz() {
            currentIndex = (currentIndex + 1) % quizDatabase.length;
            loadQuiz();
        }

        loadQuiz();
    </script>
</body>
</html>
