<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Card Quiz</title>
    <style>
        body { 
            font-family: sans-serif; 
            text-align: center; 
            background: #f0f2f5; 
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        
        #timer { 
            font-size: 20px; 
            font-weight: bold; 
            color: #F44336; 
            margin-bottom: 10px; 
        }

        .quiz-header h2 {
            margin: 5px 0;
            color: #333;
            font-size: 24px;
        }

        .cards-container { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 25px; 
            flex-wrap: wrap; 
        }

        .card { 
            background: white; 
            width: 105px;  /* တွဲလုံးများအတွက် Card အကျယ်ကို ချဲ့ထားသည် */
            height: 110px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 42px; /* စာလုံးအရွယ်အစားကို အမြဲတမ်း ကြီးကြီးနှင့် တသမတ်တည်း ထားမည် */
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); 
            cursor: pointer;
            border: 3px solid transparent;
            transition: 0.2s;
            user-select: none;
        }

        .card:hover { transform: scale(1.05); background: #fafafa; }

        .question-wrapper {
            margin-bottom: 20px;
        }

        #questionBox { 
            font-size: 24px; 
            font-weight: bold; 
            color: #2c3e50; 
            background: #fff;
            display: inline-block;
            padding: 12px 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 90%;
        }

        .correct { background: #4CAF50 !important; color: white; border-color: #2e7d32; }
        .wrong { background: #F44336 !important; color: white; border-color: #c62828; }
        
        #result { margin-top: 15px; font-size: 18px; font-weight: bold; }
        
        #nextBtn { 
            margin-top: 15px; 
            padding: 12px 25px; 
            font-size: 16px; 
            cursor: pointer; 
            display: none; 
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        #nextBtn:hover { background-color: #0b7dda; }

        @media (max-width: 480px) {
            .card { width: 95px; height: 100px; font-size: 38px; }
            #questionBox { font-size: 20px; padding: 10px 20px; }
        }
    </style>
</head>
<body>

    <div id="timer">အချိန်: 5 စက္ကန့်</div>

    <div class="quiz-header">
        <h2>Kanji Card Quiz</h2>
    </div>
    
    <div class="cards-container" id="cardsContainer"></div>

    <div class="question-wrapper">
        <div id="questionBox">မေးခွန်းပေါ်မည်</div>
    </div>

    <div id="result"></div>
    <div>
        <button id="nextBtn" onclick="nextQuiz()">နောက်တစ်ပုဒ်သို့ (Next)</button>
    </div>

    <!-- ဂျာဗားစක්‍ရिप्ट ဖိုင်များကို အစဉ်လိုက် ချိတ်ဆက်ခြင်း -->
    <script src="kanji.js"></script>
    <script src="quiz.js"></script>
    <script src="ans.js"></script>
    
    <script>
        let quizDatabase = [];

        // kanjiLists, questionLists နဲ့ answerLists (Kanji စာလုံးတိုက်ရိုက်) များကို ပေါင်းစပ်ခြင်း
        if (typeof kanjiLists !== 'undefined' && typeof questionLists !== 'undefined' && typeof answerLists !== 'undefined') {
            for (let i = 0; i < kanjiLists.length; i++) {
                if (kanjiLists[i] && questionLists[i]) {
                    quizDatabase.push({
                        kanjis: kanjiLists[i],
                        question: questionLists[i],
                        correctKanji: answerLists[i] !== undefined ? answerLists[i] : kanjiLists[i][0]
                    });
                }
            }
        }

        let currentIndex = 0;
        let timeLeft = 5;
        let timerInterval;
        let isAnswered = false;
        let currentCorrectOriginalKanji = "";

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function loadQuiz() {
            if (quizDatabase.length === 0) {
                document.getElementById("questionBox").innerText = "JS ဖိုင်များ ချိတ်ဆက်မှု မမှန်ကန်ပါ";
                return;
            }

            clearInterval(timerInterval);
            timeLeft = 5;
            isAnswered = false;
            document.getElementById("timer").innerText = "အချိန်: " + timeLeft + " စက္ကန့်";
            
            let current = quizDatabase[currentIndex];
            document.getElementById("questionBox").innerText = current.question;
            document.getElementById("result").innerText = "";
            document.getElementById("nextBtn").style.display = "none";

            // ans.js ထဲက သတ်မှတ်ထားသော အဖြေမှန် Kanji စာလုံးကို တိုက်ရိုက်ယူခြင်း
            currentCorrectOriginalKanji = current.correctKanji;
            let randomizedKanjis = shuffleArray(current.kanjis);

            let cardsContainer = document.getElementById("cardsContainer");
            cardsContainer.innerHTML = "";
            
            randomizedKanjis.forEach((kanjiChar, index) => {
                let cardDiv = document.createElement("div");
                cardDiv.className = "card";
                cardDiv.id = "card-" + index;
                cardDiv.innerText = kanjiChar;
                
                // စာလုံးအရွယ်အစားကို တွဲလုံးဖြစ်စေ၊ တစ်လုံးတည်းဖြစ်စေ အမြဲတမ်း ကြီးကြီးနှင့် ညီညာစွာ ပြသမည်
                cardDiv.style.fontSize = "42px";

                cardDiv.onclick = () => selectCard(kanjiChar, currentCorrectOriginalKanji, index);
                cardsContainer.appendChild(cardDiv);
            });

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = "အချိန်: " + timeLeft + " စက္ကန့်";

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isAnswered) {
                        timeOutAction();
                    }
                }
            }, 1000);
        }

        function selectCard(selectedKanji, correctKanji, clickedIndex) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);

            let cards = document.getElementsByClassName("card");
            for (let i = 0; i < cards.length; i++) {
                if (cards[i].innerText === correctKanji) {
                    cards[i].classList.add("correct");
                }
            }

            if (selectedKanji === correctKanji) {
                document.getElementById("result").style.color = "#4CAF50";
                document.getElementById("result").innerText = "မှန်ကန်ပါတယ်! 🎉";
            } else {
                cards[clickedIndex].classList.add("wrong");
                document.getElementById("result").style.color = "#F44336";
                document.getElementById("result").innerText = "အဖြေမှားယွင်းနေပါတယ် ❌";
            }

            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function timeOutAction() {
            isAnswered = true;
            let cards = document.getElementsByClassName("card");

            for (let i = 0; i < cards.length; i++) {
                if (cards[i].innerText === currentCorrectOriginalKanji) {
                    cards[i].classList.add("correct");
                }
            }

            document.getElementById("timer").innerText = "အချိန်ကုန်သွားပါပြီ ⌛";
            document.getElementById("result").style.color = "#F44336";
            document.getElementById("result").innerText = "အချိန်ကုန်သွားပါပြီ ❌";
            
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function nextQuiz() {
            currentIndex = (currentIndex + 1) % quizDatabase.length;
            loadQuiz();
        }

        loadQuiz();
    </script>
</body>
</html>
