<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Quiz - Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 🔵 Professional Blue Navigation Bar -->
    <nav class="navbar">
        <div class="brand">
            <span>🏮</span> Kanji App Manager
        </div>
        <div class="nav-links">
            <button class="nav-item active" onclick="switchPage('quiz')">🎮 Quiz Page</button>
            <button class="nav-item" onclick="switchPage('dashboard')">⚙️ Admin Dashboard</button>
        </div>
    </nav>

    <!-- 🎮 PAGE 1: Quiz Playing Page -->
    <main id="quizPage" class="page-view active">
        <div class="quiz-card-wrapper">
            <div id="timer">အချိန်: 5 စက္ကန့်</div>
            
            <div class="cards-container" id="cardsContainer"></div>

            <div class="question-wrapper">
                <div id="questionBox">မေးခွန်းပေါ်မည်</div>
            </div>

            <div id="result"></div>
            <button id="nextBtn" onclick="nextQuiz()">နောက်တစ်ပုဒ်သို့ (Next)</button>
        </div>
    </main>

    <!-- ⚙️ PAGE 2: Admin Dashboard Panel -->
    <main id="dashboardPage" class="page-view">
        <h2 style="margin-bottom: 20px; text-align: left; color: #1e293b;">⚙️ Kanji Set Management</h2>
        
        <div class="admin-card">
            <h3>+ မေးခွန်း / Kanji အချက်အလက်သစ် ထည့်သွင်းရန်</h3>
            <div class="form-group">
                <label>Kanji စာလုံးများ (ကော်မာ , ခြား၍ ရေးပါ):</label>
                <input type="text" id="kanjiInput" placeholder="ဥပမာ: 車, 電車, 駅">
            </div>
            <div class="form-group">
                <label>Hiragana မေးခွန်း / အဓိပ္ပာယ်:</label>
                <input type="text" id="questionInput" placeholder="ဥပမာ: でんしゃ (densha) - လျှပ်စစ်ရထား">
            </div>
            <div class="form-group">
                <label>အဖြေမှန် Kanji:</label>
                <input type="text" id="answerInput" placeholder="ဥပမာ: 電車">
            </div>
            <div class="btn-group">
                <button class="btn-primary" onclick="addQuizSet()">+ သိမ်းဆည်းမည်</button>
                <button class="btn-secondary" onclick="clearAllData()">အချက်အလက်အားလုံး ဖျက်မည်</button>
            </div>
        </div>

        <h3 style="margin-bottom: 15px; text-align: left; color: #1e293b;">📋 လက်ရှိ မေးခွန်းစာရင်း</h3>
        <div class="item-list" id="dashboardList"></div>
    </main>

    <!-- JS ဖိုင် ၃ ခုကို အချိတ်အဆက်မပျက်အောင် ထည့်ထားသော်လည်း အလွတ်ထားပါမည် -->
    <script src="kanji.js"></script>
    <script src="quiz.js"></script>
    <script src="ans.js"></script>

    <script>
        let quizDatabase = [];

        // LocalStorage မှ အချက်အလက်များကိုသာ ဖတ်ယူမည်
        function loadDatabase() {
            let localData = localStorage.getItem("myAdminQuizDB");
            if (localData) {
                quizDatabase = JSON.parse(localData);
            } else {
                quizDatabase = [];
            }
        }

        // Page Switcher
        function switchPage(pageName) {
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.page-view').forEach(page => page.classList.remove('active'));

            if (pageName === 'quiz') {
                document.querySelectorAll('.nav-item')[0].classList.add('active');
                document.getElementById('quizPage').classList.add('active');
                loadQuiz();
            } else {
                document.querySelectorAll('.nav-item')[1].classList.add('active');
                document.getElementById('dashboardPage').classList.add('active');
                renderDashboard();
            }
        }

        // Render Dashboard Items
        function renderDashboard() {
            let listContainer = document.getElementById("dashboardList");
            listContainer.innerHTML = "";

            if (quizDatabase.length === 0) {
                listContainer.innerHTML = "<p style='color:#64748b; text-align:left;'>မေးခွန်းများ မရှိသေးပါ။ အပေါ်တွင် မေးခွန်းအသစ် ထည့်ပါ၊</p>";
                return;
            }

            quizDatabase.forEach((item, index) => {
                let div = document.createElement("div");
                div.className = "list-item";
                div.innerHTML = `
                    <div class="list-item-info">
                        <strong>မေးခွန်း:</strong> ${item.question}<br>
                        <strong>Kanji စာလုံးများ:</strong> ${item.kanjis.join(", ")} | 
                        <strong>အဖြေမှန်:</strong> <span style="color:#22c55e; font-weight:bold;">${item.correctKanji}</span>
                    </div>
                    <button class="btn-danger" onclick="deleteQuizSet(${index})">ဖျက်မည်</button>
                `;
                listContainer.appendChild(div);
            });
        }

        // Add New Quiz Set
        function addQuizSet() {
            let kInput = document.getElementById("kanjiInput").value.trim();
            let qInput = document.getElementById("questionInput").value.trim();
            let aInput = document.getElementById("answerInput").value.trim();

            if (!kInput || !qInput || !aInput) {
                alert("ကျေးဇူးပြု၍ အကွက်အားလုံး ဖြည့်ပါ!");
                return;
            }

            let kanjiArray = kInput.split(",").map(s => s.trim());
            quizDatabase.push({
                kanjis: kanjiArray,
                question: qInput,
                correctKanji: aInput
            });

            localStorage.setItem("myAdminQuizDB", JSON.stringify(quizDatabase));
            alert("အချက်အလက်သစ် သိမ်းပြီးပါပြီ! 🎉");

            document.getElementById("kanjiInput").value = "";
            document.getElementById("questionInput").value = "";
            document.getElementById("answerInput").value = "";

            renderDashboard();
        }

        // Delete Single Set
        function deleteQuizSet(index) {
            if (confirm("ဒီမေးခွန်းကို ဖျက်ရန် သေချာပါသလား?")) {
                quizDatabase.splice(index, 1);
                localStorage.setItem("myAdminQuizDB", JSON.stringify(quizDatabase));
                renderDashboard();
            }
        }

        // Clear All Data
        function clearAllData() {
            if (confirm("မေးခွန်း အချက်အလက် အားလုံးကို ဖျက်ပစ်မှာ သေချာပါသလား?")) {
                localStorage.removeItem("myAdminQuizDB");
                loadDatabase();
                renderDashboard();
            }
        }

        // Quiz Mechanics
        let currentIndex = 0;
        let timeLeft = 5;
        let timerInterval;
        let isAnswered = false;
        let currentCorrectOriginalKanji = "";

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function loadQuiz() {
            loadDatabase();
            if (quizDatabase.length === 0) {
                document.getElementById("questionBox").innerText = "မေးခွန်းများ မရှိသေးပါ။ Dashboard တက်ပြီး မေးခွန်းဖြည့်ပါ။";
                document.getElementById("cardsContainer").innerHTML = "";
                document.getElementById("timer").innerText = "အချိန်: -";
                return;
            }

            clearInterval(timerInterval);
            timeLeft = 5;
            isAnswered = false;
            document.getElementById("timer").innerText = "အချိန်: " + timeLeft + " စက္ကန့်";
            
            let current = quizDatabase[currentIndex];
            document.getElementById("questionBox").innerText = current.question;
            document.getElementById("result").innerText = "";
            document.getElementById("nextBtn").style.display = "none";

            currentCorrectOriginalKanji = current.correctKanji;
            let randomizedKanjis = shuffleArray(current.kanjis);

            let cardsContainer = document.getElementById("cardsContainer");
            cardsContainer.innerHTML = "";
            
            randomizedKanjis.forEach((kanjiChar, index) => {
                let cardDiv = document.createElement("div");
                cardDiv.className = "card";
                cardDiv.id = "card-" + index;
                cardDiv.innerText = kanjiChar;

                cardDiv.onclick = () => selectCard(kanjiChar, currentCorrectOriginalKanji, index);
                cardsContainer.appendChild(cardDiv);
            });

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = "အချိန်: " + timeLeft + " စက္ကန့်";

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isAnswered) {
                        timeOutAction();
                    }
                }
            }, 1000);
        }

        function selectCard(selectedKanji, correctKanji, clickedIndex) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);

            let cards = document.getElementsByClassName("card");
            for (let i = 0; i < cards.length; i++) {
                if (cards[i].innerText === correctKanji) {
                    cards[i].classList.add("correct");
                }
            }

            if (selectedKanji === correctKanji) {
                document.getElementById("result").style.color = "#22c55e";
                document.getElementById("result").innerText = "မှန်ကန်ပါတယ်! 🎉";
            } else {
                cards[clickedIndex].classList.add("wrong");
                document.getElementById("result").style.color = "#ef4444";
                document.getElementById("result").innerText = "အဖြေမှားယွင်းနေပါတယ် ❌";
            }

            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function timeOutAction() {
            isAnswered = true;
            let cards = document.getElementsByClassName("card");

            for (let i = 0; i < cards.length; i++) {
                if (cards[i].innerText === currentCorrectOriginalKanji) {
                    cards[i].classList.add("correct");
                }
            }

            document.getElementById("timer").innerText = "အချိန်ကုန်သွားပါပြီ ⌛";
            document.getElementById("result").style.color = "#ef4444";
            document.getElementById("result").innerText = "အချိန်ကုန်သွားပါပြီ ❌";
            
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function nextQuiz() {
            currentIndex = (currentIndex + 1) % quizDatabase.length;
            loadQuiz();
        }

        loadDatabase();
        loadQuiz();
    </script>
</body>
</html>
