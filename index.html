<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanji Card Quiz & Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Tab Navigation Buttons -->
    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('quiz')">🎮 Quiz ကစားရန်</button>
        <button class="tab-btn" onclick="switchTab('dashboard')">⚙️ Dashboard (အချက်အလက်ထည့်ရန်)</button>
    </div>

    <!-- TAB 1: Quiz Playing Screen -->
    <div id="quizTab" class="tab-content active">
        <div id="timer">အချိန်: 5 စက္ကန့်</div>
        <div class="cards-container" id="cardsContainer"></div>
        <div class="question-wrapper">
            <div id="questionBox">မေးခွန်းပေါ်မည်</div>
        </div>
        <div id="result"></div>
        <div>
            <button id="nextBtn" onclick="nextQuiz()">နောက်တစ်ပုဒ်သို့ (Next)</button>
        </div>
    </div>

    <!-- TAB 2: Dashboard Management Screen -->
    <div id="dashboardTab" class="tab-content">
        <h2>⚙️ Kanji Data Dashboard</h2>
        
        <div class="dashboard-card">
            <h3>မေးခွန်းအသစ် ထည့်သွင်းရန်</h3>
            <div class="form-group">
                <label>Kanji စာလုံးများ (ကော်မာ , ခြား၍ ရေးပါ):</label>
                <input type="text" id="kanjiInput" placeholder="ဥပမာ: 車, 電車, 駅">
            </div>
            <div class="form-group">
                <label>Hiragana မေးခွန်း:</label>
                <input type="text" id="questionInput" placeholder="ဥပမာ: でんしゃ (densha) - လျှပ်စစ်ရထား">
            </div>
            <div class="form-group">
                <label>အဖြေမှန် Kanji:</label>
                <input type="text" id="answerInput" placeholder="ဥပမာ: 電車">
            </div>
            <button class="action-btn" onclick="addQuizSet()">+ အသစ်သိမ်းမည် (Save)</button>
            <button class="action-btn" style="background: #757575;" onclick="resetDefaultData()">Default မူလဒေတာ ပြန်ယူမည်</button>
        </div>

        <h3>ရှိပြီးသား မေးခွန်းများ စာရင်း</h3>
        <div class="item-list" id="dashboardList"></div>
    </div>

    <script>
        // မူလ စတင်ချိန်တွင် ပါရှိမည့် Default စာရင်း
        const defaultQuizData = [
            { kanjis: ["日", "月", "火"], question: "ひ (hi) - နေ", correctKanji: "日" },
            { kanjis: ["水", "木", "金"], question: "き (ki) - သစ်ပင်", correctKanji: "木" },
            { kanjis: ["山", "川", "田"], question: "やま (yama) - တောင်", correctKanji: "山" },
            { kanjis: ["車", "電車", "駅"], question: "でんしゃ (densha) - လျှပ်စစ်ရထား", correctKanji: "電車" }
        ];

        let quizDatabase = [];

        // LocalStorage မှ ဒေတာဖတ်ယူခြင်း
        function loadDatabase() {
            let localData = localStorage.getItem("myKanjiAppDB");
            if (localData) {
                quizDatabase = JSON.parse(localData);
            } else {
                quizDatabase = [...defaultQuizData];
                localStorage.setItem("myKanjiAppDB", JSON.stringify(quizDatabase));
            }
        }

        // Tab ပြောင်းလဲခြင်း
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'quiz') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('quizTab').classList.add('active');
                loadQuiz();
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('dashboardTab').classList.add('active');
                renderDashboard();
            }
        }

        // Dashboard ထဲတွင် စာရင်းများ ပြသခြင်း
        function renderDashboard() {
            let listContainer = document.getElementById("dashboardList");
            listContainer.innerHTML = "";

            quizDatabase.forEach((item, index) => {
                let div = document.createElement("div");
                div.className = "list-item";
                div.innerHTML = `
                    <div>
                        <strong>မေးခွန်း:</strong> ${item.question}<br>
                        <strong>Kanjis:</strong> ${item.kanjis.join(", ")} | 
                        <strong>အဖြေမှန်:</strong> <span style="color:green; font-weight:bold;">${item.correctKanji}</span>
                    </div>
                    <button class="delete-btn" onclick="deleteQuizSet(${index})">ဖျက်မည်</button>
                `;
                listContainer.appendChild(div);
            });
        }

        // မေးခွန်းအသစ် ထည့်သွင်းခြင်း
        function addQuizSet() {
            let kInput = document.getElementById("kanjiInput").value.trim();
            let qInput = document.getElementById("questionInput").value.trim();
            let aInput = document.getElementById("answerInput").value.trim();

            if (!kInput || !qInput || !aInput) {
                alert("ကျေးဇူးပြု၍ အကွက်အားလုံး ဖြည့်သွင်းပါ!");
                return;
            }

            let kanjiArray = kInput.split(",").map(s => s.trim());
            
            quizDatabase.push({
                kanjis: kanjiArray,
                question: qInput,
                correctKanji: aInput
            });

            localStorage.setItem("myKanjiAppDB", JSON.stringify(quizDatabase));
            alert("အချက်အလက်သစ် သိမ်းဆည်းပြီးပါပြီ! 🎉");

            document.getElementById("kanjiInput").value = "";
            document.getElementById("questionInput").value = "";
            document.getElementById("answerInput").value = "";

            renderDashboard();
        }

        // မေးခွန်း ဖျက်ခြင်း
        function deleteQuizSet(index) {
            if (confirm("ဒီမေးခွန်းကို ဖျက်ရန် သေချာပါသလား?")) {
                quizDatabase.splice(index, 1);
                localStorage.setItem("myKanjiAppDB", JSON.stringify(quizDatabase));
                renderDashboard();
            }
        }

        // Default ပြန်ယူခြင်း
        function resetDefaultData() {
            if (confirm("မူလ မေးခွန်းများအတိုင်း ပြန်လည် ထားရှိမှာ သေချာပါသလား?")) {
                quizDatabase = [...defaultQuizData];
                localStorage.setItem("myKanjiAppDB", JSON.stringify(quizDatabase));
                renderDashboard();
            }
        }

        // Quiz Logic
        let currentIndex = 0;
        let timeLeft = 5;
        let timerInterval;
        let isAnswered = false;
        let currentCorrectOriginalKanji = "";

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function loadQuiz() {
            loadDatabase();
            if (quizDatabase.length === 0) {
                document.getElementById("questionBox").innerText = "မေးခွန်းများ မရှိသေးပါ၊ Dashboard တွင် ထည့်ပါ။";
                document.getElementById("cardsContainer").innerHTML = "";
                return;
            }

            clearInterval(timerInterval);
            timeLeft = 5;
            isAnswered = false;
            document.getElementById("timer").innerText = "အချိန်: " + timeLeft + " စက္ကန့်";
            
            let current = quizDatabase[currentIndex];
            document.getElementById("questionBox").innerText = current.question;
            document.getElementById("result").innerText = "";
            document.getElementById("nextBtn").style.display = "none";

            currentCorrectOriginalKanji = current.correctKanji;
            let randomizedKanjis = shuffleArray(current.kanjis);

            let cardsContainer = document.getElementById("cardsContainer");
            cardsContainer.innerHTML = "";
            
            randomizedKanjis.forEach((kanjiChar, index) => {
                let cardDiv = document.createElement("div");
                cardDiv.className = "card";
                cardDiv.id = "card-" + index;
                cardDiv.innerText = kanjiChar;

                cardDiv.onclick = () => selectCard(kanjiChar, currentCorrectOriginalKanji, index);
                cardsContainer.appendChild(cardDiv);
            });

            startTimer();
        }

        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById("timer").innerText = "အချိန်: " + timeLeft + " စက္ကန့်";

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    if (!isAnswered) {
                        timeOutAction();
                    }
                }
            }, 1000);
        }

        function selectCard(selectedKanji, correctKanji, clickedIndex) {
            if (isAnswered) return;
            isAnswered = true;
            clearInterval(timerInterval);

            let cards = document.getElementsByClassName("card");
            for (let i = 0; i < cards.length; i++) {
                if (cards[i].innerText === correctKanji) {
                    cards[i].classList.add("correct");
                }
            }

            if (selectedKanji === correctKanji) {
                document.getElementById("result").style.color = "#4CAF50";
                document.getElementById("result").innerText = "မှန်ကန်ပါတယ်! 🎉";
            } else {
                cards[clickedIndex].classList.add("wrong");
                document.getElementById("result").style.color = "#F44336";
                document.getElementById("result").innerText = "အဖြေမှားယွင်းနေပါတယ် ❌";
            }

            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function timeOutAction() {
            isAnswered = true;
            let cards = document.getElementsByClassName("card");

            for (let i = 0; i < cards.length; i++) {
                if (cards[i].innerText === currentCorrectOriginalKanji) {
                    cards[i].classList.add("correct");
                }
            }

            document.getElementById("timer").innerText = "အချိန်ကုန်သွားပါပြီ ⌛";
            document.getElementById("result").style.color = "#F44336";
            document.getElementById("result").innerText = "အချိန်ကုန်သွားပါပြီ ❌";
            
            document.getElementById("nextBtn").style.display = "inline-block";
        }

        function nextQuiz() {
            currentIndex = (currentIndex + 1) % quizDatabase.length;
            loadQuiz();
        }

        // စတင်ချိန်တွင် ဒေတာဖတ်ပြီး Quiz စတင်မည်
        loadDatabase();
        loadQuiz();
    </script>
</body>
</html>
